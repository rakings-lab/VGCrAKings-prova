name: FCM prova - invia a un dispositivo
on:
  workflow_dispatch:
    inputs:
      token:
        description: "Token del dispositivo (da fcm-test.html)"
        required: true
      title:
        description: "Titolo"
        required: false
        default: "Prova rAKings"
      body:
        description: "Testo"
        required: false
        default: "Invio da script riuscito"
      link:
        description: "Link da aprire al tocco (facoltativo, es. #annuncio-5)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python fcm_send_test.py
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          FCM_TOKEN: ${{ inputs.token }}
          FCM_TITLE: ${{ inputs.title }}
          FCM_BODY: ${{ inputs.body }}
          FCM_LINK: ${{ inputs.link }}
